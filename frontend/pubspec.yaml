name: movere_app
description: "Aplicativo móvel acessível do projeto Movere."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  http_parser: ^4.1.2
  image_picker: ^1.2.2
  firebase_core: 3.15.2
  firebase_auth: 5.7.0
  cloud_firestore: 5.6.12
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  uuid: ^4.6.0
  video_player: ^2.10.1
  video_thumbnail: ^0.5.6
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/movere_mark.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/movere_mark.png
  adaptive_icon_background: "#F8FAFC"
  adaptive_icon_foreground: assets/branding/movere_mark.png
  remove_alpha_ios: true
  background_color_ios: "#F8FAFC"
